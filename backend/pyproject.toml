[project]
name = "chess-workbench-backend"
version = "0.1.0"
description = "Sanic API for ChessWorkbench"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite>=0.21,<1",
  "asyncmy>=0.2.10,<1",
  "cryptography>=42,<45",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "onnxruntime>=1.23,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pillow>=12.3,<13",
  "pypdf>=6.14.2,<7",
  "pypdfium2>=5.12.1,<6",
  "python-chess>=1.999,<2",
  "sanic>=25.3,<26",
  "sanic-ext>=24.12,<26",
  "sqlalchemy[asyncio]>=2.0.41,<3",
]

[dependency-groups]
dev = [
  "alembic>=1.16,<2",
  "hypothesis>=6.135,<7",
  "jsonschema>=4.23,<5",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "sanic-testing>=24.6,<26",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_workbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
  "ignore:websockets.legacy is deprecated:DeprecationWarning:websockets.legacy",
]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=chess_workbench",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["chess_workbench"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "T20", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["B017"]
"scripts/*.py" = ["T201"]

[tool.mypy]
python_version = "3.13"
mypy_path = "backend/src"
strict = true
disallow_untyped_decorators = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sanic_testing.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
