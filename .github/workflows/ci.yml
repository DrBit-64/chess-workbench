name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: chesstest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Chromium for Stage 4 browser acceptance
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run cumulative Stage 4 acceptance
        env:
          MYSQL_ACCEPTANCE_URL: mysql+asyncmy://root:testpass@127.0.0.1:3306/chesstest
        run: make acceptance
