name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: chesstest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install, check, test, build, and run startup smoke
        run: make acceptance

      - name: Run MySQL compatibility tests
        env:
          CHESS_WORKBENCH_MYSQL_URL: mysql+asyncmy://root:testpass@127.0.0.1:3306/chesstest
        run: |
          uv run --project backend --locked pytest \
            -c backend/pyproject.toml \
            backend/tests/test_mysql_compat.py \
            -v
